name: Publish Packwiz Pack to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: site
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install packwiz (robust)
        env:
          GOBIN: ${{ github.workspace }}/bin
          GOPROXY: https://proxy.golang.org
        run: |
          set -euo pipefail

          echo "GOBIN=${GOBIN}"
          mkdir -p "$GOBIN"

          # Prefer installing the CLI package directly
          echo "Trying go install github.com/packwiz/packwiz/cmd/packwiz@latest"
          if GOBIN="$GOBIN" go install github.com/packwiz/packwiz/cmd/packwiz@latest; then
            echo "go install succeeded"
          else
            echo "go install failed; falling back to git clone + go build"
            rm -rf packwiz-src
            git clone --depth 1 https://github.com/packwiz/packwiz.git packwiz-src
            cd packwiz-src
            go build -o "$GOBIN/packwiz" ./cmd/packwiz
            cd ..
          fi

          echo "Contents of $GOBIN:"
          ls -la "$GOBIN" || true
          echo "Contents of GOPATH/bin:"
          ls -la "$(go env GOPATH)/bin" || true

          if [ ! -x "$GOBIN/packwiz" ]; then
            echo "ERROR: packwiz binary not found in $GOBIN"
            exit 1
          fi

          echo "$GOBIN" >> $GITHUB_PATH
          echo "Installed packwiz at $GOBIN/packwiz"


      - name: Prepare site folder
        run: |
          mkdir -p site
          if [ -x bin/packwiz ]; then
            mv bin/packwiz site/packwiz
          else
            echo "ERROR: bin/packwiz not found"
            ls -la bin || true
            exit 1
          fi
          chmod +x site/packwiz
          cp pack.toml site/pack.toml
          cp index.toml site/index.toml
          cp options.txt site/options.txt
          cp LICENSE site/LICENSE
          cp -r mods site/mods
          cp -r config site/config


      - name: Refresh packwiz index
        run: |
          cd site
          ./packwiz refresh

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
